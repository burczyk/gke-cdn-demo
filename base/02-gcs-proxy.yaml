apiVersion: v1
kind: ConfigMap
metadata:
  name: gcs-proxy-conf
  labels:
    app: gcs-proxy
data:
  default.conf: |
    server {
      listen 8080;

      # Respond 200 OK to GKE Gateway's default HTTP GET / health check
      location = / {
        return 200 "gcs-proxy healthy\n";
      }

      # Proxy rewritten /<object> requests to the GCS bucket
      location / {
        proxy_pass https://storage.googleapis.com/<YOUR_BUCKET_NAME>/;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_hide_header Set-Cookie;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs-proxy
  labels:
    app: gcs-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcs-proxy
  template:
    metadata:
      labels:
        app: gcs-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: conf
        configMap:
          name: gcs-proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: gcs-proxy-svc
  labels:
    app: gcs-proxy
spec:
  type: ClusterIP
  selector:
    app: gcs-proxy
  ports:
  - name: http
    port: 80
    targetPort: 8080